<html lang="en">
    <head>

    <body>

        <table>
            <thead>

                    <th>Заголовок 1</th>
                    <th>Заголовок 2</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <tb>Ячейка 1</tb>
                    <tb>Ячейка 2</tb>
                </tr>
            </tbody>
        </table>

        <iframe src="https://example.com" title="Пример iframe" width="600" height="400"></iframe>
